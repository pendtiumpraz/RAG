name: CI

# Gerbang sebelum kode mendarat di main — dan main auto-deploy ke produksi,
# jadi yang lolos di sini yang tayang. Sengaja TIDAK memakai database: unit
# test dan build harus bisa jalan tanpa rahasia apa pun, supaya PR dari luar
# pun tetap terverifikasi. Uji yang butuh DB ada di `npm run smoke`, dijalankan
# manual terhadap Neon.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      # `next build` sekaligus typecheck TS strict — itu gerbang tipe kita.
      # Nilai dummy dipakai supaya modul yang membaca env saat import tidak
      # meledak; tak satu pun menyentuh layanan nyata saat build.
      - name: Build (termasuk typecheck)
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-dummy-secret-cukup-panjang-untuk-lolos
          NEXTAUTH_URL: http://localhost:3000
          CREDENTIALS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: npm run build

  # Uji ber-DATABASE. ALASANNYA KONKRET: widget embed pernah rusak TOTAL di
  # produksi (setiap /api/chat/<publicKey> membalas 404) karena RLS memblokir
  # lookup publik — dan lolos justru karena tak ada tes yang menyentuh jalur
  # itu. Unit test tak bisa menangkap kelas bug ini; hanya Postgres sungguhan
  # dengan RLS aktif yang bisa.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nalar_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: nalar_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nalar_owner -d nalar_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # DDL & migrasi dijalankan sebagai OWNER.
      DATABASE_URL_UNPOOLED: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
      DATABASE_URL_ADMIN: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
      APP_PW: ci_app_pw
      NEXTAUTH_SECRET: ci-dummy-secret-cukup-panjang-untuk-lolos
      NEXTAUTH_URL: http://localhost:3000
      CREDENTIALS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Bobot embedding ditarik dari Hugging Face; blob milik superadmin tak
      # boleh jadi syarat CI.
      EMBEDDING_MODEL_SOURCE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Ekstensi HARUS ada sebelum push: schema.ts memuat kolom vector(1536)
      # dan index HNSW, yang tak bisa dibuat tanpa pgvector.
      - name: Ekstensi pgvector
        env:
          DATABASE_URL: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
        run: node scripts/ensure-extensions.mjs

      - name: Skema (drizzle push, sbg owner)
        env:
          DATABASE_URL: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
        run: npx drizzle-kit push --force

      - name: Migrasi SQL (pgvector + RLS + policy)
        env:
          DATABASE_URL: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
        run: npx tsx src/modules/core/db/migrate.ts

      # Migrasi HARUS idempoten — pernah tidak, dan jalan kedua selalu gagal.
      - name: Migrasi dijalankan ULANG (uji idempotensi)
        env:
          DATABASE_URL: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
        run: npx tsx src/modules/core/db/migrate.ts

      - name: Role aplikasi NOBYPASSRLS
        env:
          DATABASE_URL: postgres://nalar_owner:ci_owner_pw@localhost:5432/nalar_ci
        run: node scripts/create-app-role.mjs

      # Smoke berjalan sebagai nalar_app — kalau dijalankan sebagai owner,
      # RLS akan dilewati dan uji isolasinya jadi tak berarti.
      # SMOKE_STRICT=1: bagian yang gagal dihitung GAGAL, bukan "dilewati".
      # Tanpa ini pipeline bisa hijau sambil tak menguji apa pun.
      - name: Smoke e2e (RLS, delta sync, gerbang verifikasi, embed publik)
        env:
          DATABASE_URL: postgres://nalar_app:ci_app_pw@localhost:5432/nalar_ci
          SMOKE_STRICT: '1'
        run: npx tsx scripts/smoke.ts

  # Dipisah supaya kerentanan dependensi tidak memblokir rilis fitur, tapi
  # tetap terlihat. `--omit=dev` karena kerentanan di perkakas build tidak
  # ikut tayang ke produksi.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high
