# On-prem one-command stack: Postgres+pgvector and the Next.js app.
# `docker compose up` gives you a fully self-hosted, air-gap-capable RAG.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://rag:rag@db:5432/rag
    ports:
      - "3000:3000"
    volumes:
      # Cache for downloaded embedding model files (80MB / 2GB) so they
      # are pulled from Drive/SharePoint once and reused across restarts.
      - modelcache:/app/.model-cache

volumes:
  pgdata:
  modelcache:
